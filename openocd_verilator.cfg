adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9999

adapter speed 1000

transport select jtag
jtag newtap cv32e40p tap -irlen 5 -expected-id 0x249511C3
target create cv32e40p.cpu riscv -chain-position cv32e40p.tap

init
# read raw DMI registers before halt attempt
echo "--- DMI register dump ---"
riscv dmi_read 0x11
riscv dmi_read 0x10
riscv dmi_read 0x04
riscv dmi_read 0x05

halt
echo "Halted — ready for GDB on port 3333"